project: sre-on-call
environment: dev

defaults:
  model_id: us.anthropic.claude-haiku-4-5-20251001-v1:0
  network_mode: PUBLIC

agents:
  master:
    # Orchestrator runs a Sonnet-class model (routing + synthesis judgment);
    # scanners stay on the default Haiku. See issue #46.
    model_id: us.anthropic.claude-sonnet-4-6
    skills:
      - investigate_alert
      - capture_status_snapshot
      - finalize_postmortem
    # Change-correlation source (rec #6, "what changed?") — default OFF. The
    # deployment-annotator posts deploy annotations to Grafana; the master can
    # read them via the Grafana MCP to correlate cross-system (RDS/ASG/non-k8s)
    # changes the EKS rollout reads can't see. To enable:
    #   1. terraform var enable_grafana_change_source=true (provisions the token
    #      secret + master IAM grant + the GRAFANA_CHANGE_SOURCE_TOKEN env var),
    #   2. fill in the Grafana MCP endpoint below and uncomment the block.
    # mcp_loader honors `api_key:<ENV>` auth via resolve_secret() (the same
    # literal-or-ARN dual-mode seam as SLACK_BOT_TOKEN).
    # mcps:
    #   - name: grafana
    #     transport: streamable_http
    #     endpoint: https://<grafana-host>/mcp
    #     auth: api_key:GRAFANA_CHANGE_SOURCE_TOKEN
    mcps: []

  slack_scanner:
    enabled: true
    skills:
      - scan_slack_channels
      - capture_snapshot
    mcps: []

  cloudwatch_logs:
    enabled: true
    # Bounded iterative investigator (issue #58): a Sonnet-class model runs a
    # short drill-down loop (query from hints → refine once on suspicious
    # results), hard-capped at 4 tool-use cycles and the master's deadline.
    model_id: us.anthropic.claude-sonnet-4-6
    max_tool_cycles: 4
    skills:
      - discover_log_groups
      - query_cloudwatch_logs
      - capture_snapshot
    mcps:
      - name: aws_docs
        transport: streamable_http
        endpoint: https://knowledge-mcp.global.api.aws
        auth: none

  eks:
    enabled: true
    network_mode: VPC
    # Bounded iterative investigator (issue #58): Sonnet drills state → crashloop
    # → that pod's logs + events, hard-capped at 4 tool-use cycles + deadline.
    model_id: us.anthropic.claude-sonnet-4-6
    max_tool_cycles: 4
    skills:
      # Change-correlation ("what changed?") — called first, once, as a cheap
      # read before broad state-gathering. Gated by CHANGE_CORRELATION_ENABLED
      # (terraform var enable_change_correlation, default on); fail-open.
      - detect_recent_changes
      - gather_eks_state
      - capture_snapshot
    mcps: []

  incident_history:
    enabled: true
    skills:
      - find_similar_incidents
      - capture_snapshot
    mcps: []
