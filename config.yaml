project: sre-on-call
environment: dev

defaults:
  model_id: us.anthropic.claude-haiku-4-5-20251001-v1:0
  network_mode: PUBLIC

agents:
  master:
    # Orchestrator runs a Sonnet-class model (routing + synthesis judgment);
    # scanners stay on the default Haiku. See issue #46.
    model_id: us.anthropic.claude-sonnet-4-6
    skills:
      - investigate_alert
      - capture_status_snapshot
      - finalize_postmortem
    mcps: []

  slack_scanner:
    enabled: true
    skills:
      - scan_slack_channels
      - capture_snapshot
    mcps: []

  discord_scanner:
    enabled: false
    skills:
      - scan_discord_channels
      - capture_snapshot
    mcps: []

  cloudwatch_logs:
    enabled: true
    # Bounded iterative investigator (issue #58): a Sonnet-class model runs a
    # short drill-down loop (query from hints → refine once on suspicious
    # results), hard-capped at 4 tool-use cycles and the master's deadline.
    model_id: us.anthropic.claude-sonnet-4-6
    max_tool_cycles: 4
    skills:
      - query_cloudwatch_logs
      - capture_snapshot
    mcps:
      - name: aws_docs
        transport: streamable_http
        endpoint: https://knowledge-mcp.global.api.aws
        auth: none

  eks:
    enabled: true
    network_mode: VPC
    # Bounded iterative investigator (issue #58): Sonnet drills state → crashloop
    # → that pod's logs + events, hard-capped at 4 tool-use cycles + deadline.
    model_id: us.anthropic.claude-sonnet-4-6
    max_tool_cycles: 4
    skills:
      - gather_eks_state
      - capture_snapshot
    mcps: []

  incident_history:
    enabled: true
    skills:
      - find_similar_incidents
      - capture_snapshot
    mcps: []
